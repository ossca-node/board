    <meta charset="UTF-8" />

    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="연도별 Node.js 기여 활동 기록" />
    <script data-color-mode-bootstrap>
      (() => {
        let storedMode = null;
        try {
          storedMode = window.localStorage.getItem("color-mode");
        } catch {}
        const colorMode = storedMode === "light" || storedMode === "dark"
          ? storedMode
          : window.matchMedia?.("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.colorMode = colorMode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          colorMode === "dark" ? "#0b1520" : "#f6f8fa",
        );
      })();
    </script>
    <style data-color-mode-bootstrap>
      html, body { background-color: #f1f3f0; }
      html[data-color-mode="dark"], html[data-color-mode="dark"] body { background-color: #0b1520; }
    </style>
